<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aria HTTP Adapter — Example 4</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
    }
    h1 { color: #2a5a8c; }
    .row { margin: 24px 0; padding: 16px; border: 1px solid #ddd;
           border-radius: 8px; }
    .label { color: #666; font-size: 12px; text-transform: uppercase;
             letter-spacing: 0.05em; }
    input[type=text] {
        width: 100%; box-sizing: border-box; padding: 8px;
        font-size: 16px; border: 1px solid #ccc; border-radius: 4px;
    }
    .counter { font-size: 48px; font-weight: 600; color: #2a5a8c; }
    button {
        background: #2a5a8c; color: white; border: none;
        padding: 10px 20px; font-size: 14px; border-radius: 4px;
        cursor: pointer; margin-right: 8px;
    }
    button:hover { background: #1e4570; }
    .status { font-size: 12px; color: #888; margin-top: 8px; }
    .ok { color: #2a8c3f; }
    .err { color: #c33; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 4px;
          overflow-x: auto; }
</style>
</head>
<body>

<h1>Aria HTTP Adapter — Live Demo</h1>
<p>This page is bound to a C++ ViewModel running in a server process.
   Edit the input, click the buttons, and watch state flow in both directions.</p>

<div class="row">
    <div class="label">Greeting (text, two-way binding)</div>
    <input type="text" id="greeting" placeholder="server will populate...">
</div>

<div class="row">
    <div class="label">Counter (int, server-driven, ticks every 5s)</div>
    <div class="counter" id="counter">…</div>
    <div style="margin-top: 12px;">
        <button id="bump-1">+1</button>
        <button id="bump-10">+10</button>
        <button id="reset">Reset</button>
    </div>
</div>

<div class="row">
    <div class="label">Connection</div>
    <div class="status" id="status">Connecting…</div>
</div>

<script type="module">
import { AriaClient } from './aria_client.js';

const client = new AriaClient(window.location.origin);
const $status   = document.getElementById('status');
const $greeting = document.getElementById('greeting');
const $counter  = document.getElementById('counter');

client.onError((e) => {
    $status.className = 'err';
    $status.textContent = 'Disconnected — retrying…';
});

client.subscribe('greeting', (val) => {
    if (document.activeElement !== $greeting) {
        $greeting.value = val;
    }
});

client.subscribe('counter', (val) => {
    $counter.textContent = String(val);
});

$greeting.addEventListener('input', (e) => {
    client.setText('greeting', e.target.value);
});

document.getElementById('reset').addEventListener('click', () => {
    client.click('reset');
});
document.getElementById('bump-1').addEventListener('click', () => {
    client.command('counter', 'bump', { by: 1 });
});
document.getElementById('bump-10').addEventListener('click', () => {
    client.command('counter', 'bump', { by: 10 });
});

await client.connect();
$status.className = 'ok';
$status.textContent = 'Connected • protocol v1';
</script>

</body>
</html>
