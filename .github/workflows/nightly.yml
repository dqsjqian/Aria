name: Nightly bench

on:
  schedule:
    # 02:00 UTC every day. Pick a slot that doesn't compete with the
    # ordinary CI rush hour.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Published release baseline for same-runner fixed-window regression"
        required: false
        default: "v3.1.1"
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-bench
  # Preserve the active fixed-sample campaign when a schedule or dispatch arrives.
  cancel-in-progress: false

jobs:
  bench:
    name: Paired regression (Ubuntu 24.04, GCC 14) + historical report
    runs-on: ubuntu-24.04
    env:
      CC: /usr/bin/gcc-14
      CXX: /usr/bin/g++-14
    steps:
      - uses: actions/checkout@v7

      - name: Install GCC 14 and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14

      - name: Record Linux environment before builds and measurement
        run: |
          mkdir -p bench-comparison
          {
            date --utc --iso-8601=seconds
            uname -srvmo
            cat /etc/os-release
            lscpu
            taskset -pc $$
            cat /proc/loadavg
            for path in /proc/pressure/cpu /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/cpuset.cpus.effective; do
              echo "--- $path ---"
              if [[ -r "$path" ]]; then cat "$path"; else echo unavailable; fi
            done
          } > bench-comparison/host-before.txt
          {
            "$CC" --version
            "$CXX" --version
            cmake --version
            ninja --version
            dpkg-query -W -f='${Package} ${Version}\n' gcc-14 g++-14 ninja-build
          } > bench-comparison/toolchain.txt

      - name: Configure (Release, no sanitizers)
        run: |
          cmake -S . -B build/flavors/bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIA_BUILD_TESTS=OFF \
            -DARIA_BUILD_BENCHMARK=ON \
            -DARIA_ENABLE_ASAN=OFF \
            -DARIA_ENABLE_UBSAN=OFF \
            -DARIA_ENABLE_TSAN=OFF \
            -DARIA_ENABLE_MSAN=OFF \
            -DARIA_BENCH_CONTROL_STRETCH_PERCENT=0

      - name: Build all bench binaries
        id: build-candidate
        # Keep this list in sync with `benches=(...)` in
        # scripts/check-bench.sh and benchmark/CMakeLists.txt.
        run: |
          cmake --build build/flavors/bench -j \
            --target \
              aria_bench_regression \
              aria_bench_iproperty \
              aria_bench_command \
              aria_bench_async_command \
              aria_bench_list \
              aria_bench_derived_list \
              aria_bench_trace_sink

      - name: Verify published baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_REF: ${{ inputs.baseline_ref || 'v3.1.1' }}
        run: |
          mkdir -p bench-comparison
          gh release view "$BASELINE_REF" --json tagName,isDraft,isPrerelease > bench-comparison/release-baseline.json
          python3 scripts/verify-bench-release.py bench-comparison/release-baseline.json "$BASELINE_REF"

      - name: Checkout release baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref || 'v3.1.1' }}
          path: baseline-source

      - name: Build release with the exact candidate harness
        id: build-baseline
        run: |
          cp benchmark/*.cpp benchmark/bench_common.hpp benchmark/CMakeLists.txt baseline-source/benchmark/
          sha256sum benchmark/*.cpp benchmark/bench_common.hpp benchmark/CMakeLists.txt > bench-comparison/harness-sha256.txt
          cmake -S baseline-source -B baseline-source/build/flavors/bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIA_BUILD_TESTS=OFF \
            -DARIA_BUILD_BENCHMARK=ON \
            -DARIA_ENABLE_ASAN=OFF \
            -DARIA_ENABLE_UBSAN=OFF \
            -DARIA_ENABLE_TSAN=OFF \
            -DARIA_ENABLE_MSAN=OFF \
            -DARIA_BENCH_CONTROL_STRETCH_PERCENT=0
          cmake --build baseline-source/build/flavors/bench -j --target aria_bench_regression aria_bench_iproperty aria_bench_command aria_bench_trace_sink
          git rev-parse HEAD > bench-comparison/candidate-revision.txt
          git -C baseline-source rev-parse HEAD > bench-comparison/baseline-revision.txt
          "$CXX" --version > bench-comparison/compiler.txt

      - name: Build independent real-delay measurement control
        id: build-control
        run: |
          cmake -S baseline-source -B baseline-source/build/flavors/control -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIA_BUILD_TESTS=OFF \
            -DARIA_BUILD_BENCHMARK=ON \
            -DARIA_ENABLE_ASAN=OFF \
            -DARIA_ENABLE_UBSAN=OFF \
            -DARIA_ENABLE_TSAN=OFF \
            -DARIA_ENABLE_MSAN=OFF \
            -DARIA_BENCH_CONTROL_STRETCH_PERCENT=20
          cmake --build baseline-source/build/flavors/control -j \
            --target aria_bench_regression aria_bench_iproperty aria_bench_command aria_bench_trace_sink

      - name: Retain build configuration and commands
        run: |
          for role in candidate baseline control; do
            case "$role" in
              candidate) directory=build/flavors/bench ;;
              baseline) directory=baseline-source/build/flavors/bench ;;
              control) directory=baseline-source/build/flavors/control ;;
            esac
            cp "$directory/CMakeCache.txt" "bench-comparison/$role-CMakeCache.txt"
            cp "$directory/compile_commands.json" "bench-comparison/$role-compile_commands.json"
          done

      - name: Historical absolute budget (profile-qualified)
        if: always() && steps.build-candidate.outcome == 'success'
        shell: bash
        # Linux/GCC has no historical M3 Pro/AppleClang calibration. Exit 3 is
        # explicitly unavailable, never an absolute-budget pass.
        # The independent paired gate below still must pass on this runner.
        run: |
          set -o pipefail
          status=0
          ./scripts/check-bench.sh build/flavors/bench 2>&1 | tee bench-output.txt || status=$?
          echo "Historical absolute-budget exit status: $status" | tee -a bench-output.txt
          if [[ $status -eq 3 ]]; then
            echo "Historical absolute budget unavailable on this profile; see measurements." >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi

      - name: Gate fixed-window mean and batch-mean P99 against the release
        if: always() && steps.build-control.outcome == 'success'
        run: |
          python3 scripts/run-bench-validation.py \
            --baseline baseline-source/build/flavors/bench/bin \
            --candidate build/flavors/bench/bin \
            --slow-control baseline-source/build/flavors/control/bin \
            --output bench-comparison/validation

      - name: Record Linux environment after measurement
        if: always()
        # Observation only: do not change affinity, scheduling, load limits,
        # sample counts or acceptance policy in response to these values.
        run: |
          mkdir -p bench-comparison
          {
            date --utc --iso-8601=seconds
            lscpu
            taskset -pc $$
            cat /proc/loadavg
            for path in /proc/pressure/cpu /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/cpuset.cpus.effective; do
              echo "--- $path ---"
              if [[ -r "$path" ]]; then cat "$path"; else echo unavailable; fi
            done
          } > bench-comparison/host-after.txt

      - name: Upload bench output
        # Always upload, even on failure — that way the regressed
        # numbers are captured for offline diff against earlier runs.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-output-${{ github.run_id }}
          path: |
            bench-output.txt
            bench-comparison/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────
  # TSan nightly — ThreadSanitizer is heavy and noisy under racy CI
  # runners; we keep it out of the per-PR pipeline and run it once a
  # day instead. Failure is non-blocking for PRs but visible here.
  # ────────────────────────────────────────────────────────────────────
  tsan:
    name: TSan (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install ninja
        run: brew install ninja

      - name: Configure (TSan)
        run: |
          cmake -S . -B build/flavors/tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DARIA_ENABLE_TSAN=ON \
            -DARIA_BUILD_HTTP=ON \
            -DARIA_HTTP_ENABLE_TLS=OFF \
            -DARIA_BUILD_BENCHMARK=OFF \
            -DARIA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/flavors/tsan -j

      - name: Test
        env:
          # The TSan runtime takes a while to start each test exe; the
          # default ctest timeout (1500s) is plenty, but we keep this
          # explicit so a hang shows up as a TSan failure rather than
          # an indefinite job.
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: ctest --test-dir build/flavors/tsan --output-on-failure --timeout 600

  # ────────────────────────────────────────────────────────────────────
  # Fuzz nightly — the lifecycle.md coverage table (L-13/17/20/31/32/36/37)
  # states a target of 1M iterations per fuzzer. `ctest` only ever ran them
  # at the 50k developer default, so that number was aspirational: nothing
  # in CI executed the run the docs describe. This job is that run.
  #
  # Sanitizers are on, because the whole point of the high iteration count
  # is to give ASan/UBSan enough interleavings to trip on. Kept nightly:
  # 1M x 8 fuzzers under ASan is far too slow for the per-PR pipeline.
  # ────────────────────────────────────────────────────────────────────
  fuzz:
    name: Fuzz 1M iters (ASan + UBSan)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install ninja
        run: brew install ninja

      - name: Configure (ASan + UBSan)
        run: |
          cmake -S . -B build/flavors/fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DARIA_ENABLE_ASAN=ON \
            -DARIA_ENABLE_UBSAN=ON \
            -DARIA_BUILD_TESTS=ON \
            -DARIA_BUILD_BENCHMARK=OFF

      - name: Build fuzzers
        run: cmake --build build/flavors/fuzz --target aria_fuzz -j

      - name: Run fuzzers at the documented 1M iterations
        env:
          # Matches the per-fuzzer target in docs/reference/lifecycle.md.
          # NOTE: no detect_leaks here. LeakSanitizer is not supported by
          # ASan on macOS (Apple Silicon runners print "detect_leaks is
          # not supported on this platform" and, combined with
          # abort_on_error, abort the process at startup — the exact
          # failure that broke this job every night from 2026-09-01).
          # On Linux, where LSan exists, detect_leaks defaults to ON
          # anyway, so omitting it loses nothing.
          ARIA_FUZZ_ITERS: "1000000"
          ASAN_OPTIONS: "abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: ./build/flavors/fuzz/bin/aria_fuzz --no-skipped-summary
