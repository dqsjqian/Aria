name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────
  # macOS — AppleClang + Ninja, with sanitizer pass and Qt6 build
  # ────────────────────────────────────────────────────────────────────
  macos:
    name: macOS (AppleClang)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install ninja
        run: brew install ninja

      - name: Require Node for HTTP SDK tests
        run: command -v node

      - name: Configure (Release)
        run: |
          cmake -S . -B build/flavors/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIA_BUILD_HTTP=ON \
            -DARIA_HTTP_ENABLE_TLS=OFF

      - name: Build
        run: cmake --build build/flavors/release -j

      - name: Test
        run: ctest --test-dir build/flavors/release --output-on-failure

      - name: Configure (ASan + UBSan)
        run: |
          cmake -S . -B build/flavors/asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DARIA_ENABLE_ASAN=ON \
            -DARIA_ENABLE_UBSAN=ON

      - name: Build (sanitized)
        run: cmake --build build/flavors/asan -j

      - name: Test (sanitized)
        run: ctest --test-dir build/flavors/asan --output-on-failure

      - name: Install Qt6
        run: brew install qtbase

      - name: Configure (Qt6)
        run: |
          cmake -S . -B build/flavors/qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIA_BUILD_QT6=ON \
            -DCMAKE_PREFIX_PATH=$(brew --prefix qtbase)

      - name: Build (Qt6)
        run: cmake --build build/flavors/qt -j

      - name: Test (Qt6)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/flavors/qt --output-on-failure

      - name: Configure (AppKit)
        run: |
          cmake -S . -B build/flavors/appkit -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIA_BUILD_APPKIT=ON \
            -DARIA_BUILD_BENCHMARK=OFF

      - name: Build and test (AppKit)
        run: |
          cmake --build build/flavors/appkit -j
          ctest --test-dir build/flavors/appkit -R "appkit_" --output-on-failure

  # ────────────────────────────────────────────────────────────────────
  # UIKit adapter — compile and run the shared conformance battery inside
  # an iOS simulator. This used to live inside an example app and therefore
  # had no CI gate.
  # ────────────────────────────────────────────────────────────────────
  uikit:
    name: UIKit conformance + table source (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Configure simulator target
        run: |
          cmake -S . -B build/platforms/uikit-test -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=$(uname -m) \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DARIA_BUILD_UIKIT=ON \
            -DARIA_BUILD_TESTS=ON \
            -DARIA_BUILD_BENCHMARK=OFF \
            -DARIA_BUILD_SHARED=OFF

      - name: Build simulator test targets
        run: |
          cmake --build build/platforms/uikit-test --config Debug --target test_uikit_conformance
          cmake --build build/platforms/uikit-test --config Debug --target test_uikit_table_source

      - name: Run simulator tests
        run: |
          # Reuse a device the runner already has. Creating one from
          # "first iPhone devicetype x first available iOS runtime" is
          # not a valid pairing in general — a newer runtime drops older
          # iPhone models — and `simctl create` then fails with
          # `code=403 Incompatible device`. Selection logic lives in a
          # script so it can be run and debugged locally.
          UDID=$(python3 scripts/pick-ios-simulator.py)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" \
            "$PWD/build/platforms/uikit-test/bin/Debug/test_uikit_conformance.app/test_uikit_conformance"
          # The list/table bridge is a separate binary so a table
          # regression names itself here instead of hiding inside
          # "conformance". Same simulator, same boot.
          xcrun simctl spawn "$UDID" \
            "$PWD/build/platforms/uikit-test/bin/Debug/test_uikit_table_source.app/test_uikit_table_source"

  # ────────────────────────────────────────────────────────────────────
  # Android — compile both 64-bit ABIs; run native tests on an x86_64
  # emulator. JNI function-table/list tests run here; this is not an
  # Android UI instrumentation suite. Native targets retain minSdk 23.
  # ────────────────────────────────────────────────────────────────────
  android:
    name: Android (NDK 29, arm64 + x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARIA_NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v7

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ARIA_NDK_VERSION"

      - name: Configure and build both Android ABIs
        run: |
          for abi in arm64-v8a x86_64; do
            cmake -S . -B "build/platforms/android-$abi" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$ARIA_NDK_VERSION/build/cmake/android.toolchain.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-23 \
              -DANDROID_STL=c++_shared \
              -DARIA_BUILD_SHARED=ON \
              -DARIA_BUILD_TESTS=ON \
              -DARIA_BUILD_BENCHMARK=OFF \
              -DARIA_BUILD_JNI=ON \
              -DARIA_BUILD_HTTP=ON \
              -DARIA_HTTP_ENABLE_TLS=OFF
            cmake --build "build/platforms/android-$abi" --parallel 2
          done

      - name: Test JavaScript SDK on host
        run: node modules/adapters/http/web-sdk/test_aria_client.mjs

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run all native tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/run-android-tests.py build/platforms/android-x86_64 --serial emulator-5554 --output build/android-test-results.json

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-native-test-results
          path: build/android-test-results.json
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────
  # Ubuntu — gcc + clang matrix, plus Qt6 dev packages. C++23 is the
  # framework baseline since 3.0; both compiler families build the full
  # tree (Continuo included) against it.
  # ────────────────────────────────────────────────────────────────────
  ubuntu:
    name: Ubuntu (${{ matrix.compiler }}, C++${{ matrix.standard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
            standard: 23
          - compiler: clang
            cc: clang-19
            cxx: clang++-19
            standard: 23
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain + Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build ${{ matrix.cc }} ${{ matrix.cxx }} \
            qt6-base-dev libqt6widgets6 \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev

      - name: Require Node for HTTP SDK tests
        run: command -v node

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build/flavors/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ matrix.standard }} \
            -DARIA_BUILD_QT6=ON \
            -DARIA_BUILD_HTTP=ON \
            -DARIA_HTTP_ENABLE_TLS=OFF

      - name: Build
        run: cmake --build build/flavors/release -j

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/flavors/release --output-on-failure

      - name: Install and exercise standalone HTTP package consumer
        run: |
          aria_prefix="$RUNNER_TEMP/aria-prefix"
          cmake --install build/flavors/release --prefix "$aria_prefix"
          mv "$aria_prefix" "$RUNNER_TEMP/aria-prefix-relocated"
          aria_prefix="$RUNNER_TEMP/aria-prefix-relocated"
          aria_config=$(find "$aria_prefix" -name ariaConfig.cmake -type f -print -quit)
          test -n "$aria_config"
          cmake -S tests/package_http -B build/flavors/package-http -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -Daria_DIR="$(dirname "$aria_config")" \
            -DARIA_PACKAGE_EXPECT_TLS=OFF
          cmake --build build/flavors/package-http -j
          ctest --test-dir build/flavors/package-http --no-tests=error --output-on-failure

      # Leak coverage lives here and nowhere else: the macOS ASan job
      # cannot detect leaks (LeakSanitizer is unavailable on Darwin and
      # aborts if you ask for it), so before this step a leaked coroutine
      # frame could survive every job in the matrix. LSan is on by default
      # under ASan on Linux, so no extra option is needed.
      - name: Configure (ASan + UBSan, leak detection)
        if: matrix.compiler == 'gcc'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build/flavors/asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DARIA_SANITIZE=asan+ubsan \
            -DARIA_BUILD_HTTP=ON \
            -DARIA_HTTP_ENABLE_TLS=OFF

      - name: Build (sanitized)
        if: matrix.compiler == 'gcc'
        run: cmake --build build/flavors/asan -j

      - name: Test (sanitized, leaks are failures)
        if: matrix.compiler == 'gcc'
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build/flavors/asan --output-on-failure

  # ────────────────────────────────────────────────────────────────────
  # Windows — MSYS2 UCRT64 + GCC + Ninja + Qt6 (no MSVC)
  # ────────────────────────────────────────────────────────────────────
  windows-msys2:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2 UCRT64 + Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-nodejs

      - name: Show toolchain versions
        run: |
          g++ --version
          cmake --version
          ninja --version
          node --version

      - name: Configure
        run: |
          cmake -S . -B build/flavors/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIA_BUILD_QT6=ON \
            -DARIA_BUILD_HTTP=ON \
            -DARIA_HTTP_ENABLE_TLS=OFF

      - name: Build
        run: cmake --build build/flavors/release -j

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/flavors/release --output-on-failure

      - name: Install and exercise standalone HTTP package consumer
        run: |
          aria_prefix="$(cygpath -u "$RUNNER_TEMP")/aria-prefix"
          cmake --install build/flavors/release --prefix "$aria_prefix"
          aria_config=$(find "$aria_prefix" -name ariaConfig.cmake -type f -print -quit)
          test -n "$aria_config"
          cmake -S tests/package_http -B build/flavors/package-http -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Daria_DIR="$(dirname "$aria_config")" \
            -DARIA_PACKAGE_EXPECT_TLS=OFF
          cmake --build build/flavors/package-http -j
          PATH="$aria_prefix/bin:$PATH" \
            ctest --test-dir build/flavors/package-http --no-tests=error --output-on-failure

  # ────────────────────────────────────────────────────────────────────
  # Windows — native MSVC (Visual Studio 2022) + Qt6 binary install
  # ----------------------------------------------------------------------------
  # The MSYS2 job above covers GCC-on-Windows; this one covers the
  # *real* MSVC toolchain that downstream consumers most often pair
  # with. It runs on every PR — slower than MSYS2 but mandatory for
  # ABI-stable claims on Windows.
  # ────────────────────────────────────────────────────────────────────
  windows-msvc:
    name: Windows (MSVC 2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 (binary)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure (MSVC, Release)
        shell: pwsh
        run: |
          Get-Command node -ErrorAction Stop
          cmake -S . -B build/flavors/release `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DARIA_BUILD_QT6=ON `
            -DARIA_BUILD_HTTP=ON `
            -DARIA_HTTP_ENABLE_TLS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build/flavors/release --config Release -j

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/flavors/release -C Release --output-on-failure

      - name: Install and exercise standalone HTTP package consumer
        shell: pwsh
        run: |
          $ariaPrefix = Join-Path $env:RUNNER_TEMP "aria-prefix"
          cmake --install build/flavors/release --config Release --prefix "$ariaPrefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ariaConfigs = @(Get-ChildItem -Path $ariaPrefix -Filter ariaConfig.cmake -File -Recurse)
          if ($ariaConfigs.Count -ne 1) {
            throw "Expected exactly one installed ariaConfig.cmake, found $($ariaConfigs.Count)"
          }
          cmake -S tests/package_http -B build/flavors/package-http `
            -G "Visual Studio 17 2022" -A x64 `
            -Daria_DIR="$($ariaConfigs[0].DirectoryName)" `
            -DARIA_PACKAGE_EXPECT_TLS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/flavors/package-http --config Release -j
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$ariaPrefix/bin;$env:PATH"
          ctest --test-dir build/flavors/package-http -C Release --no-tests=error --output-on-failure

      - name: Configure (MSVC, Debug ASan)
        shell: pwsh
        run: |
          cmake -S . -B build/flavors/asan `
            -G "Visual Studio 17 2022" -A x64 `
            -DARIA_ENABLE_ASAN=ON `
            -DARIA_ENABLE_UBSAN=OFF `
            -DARIA_ENABLE_TSAN=OFF `
            -DARIA_BUILD_TESTS=ON `
            -DARIA_BUILD_BENCHMARK=OFF `
            -DARIA_BUILD_QT6=OFF `
            -DARIA_BUILD_HTTP=ON `
            -DARIA_HTTP_ENABLE_TLS=OFF

      - name: Build (MSVC, Debug ASan)
        shell: pwsh
        run: cmake --build build/flavors/asan --config Debug -j

      - name: Test (MSVC, Debug ASan)
        shell: pwsh
        run: |
          # Use the runtime next to the compiler CMake actually selected,
          # so another Visual Studio/LLVM installation cannot supply its DLL.
          $compilerFiles = @(Get-ChildItem build/flavors/asan/CMakeFiles -Filter CMakeCXXCompiler.cmake -File -Recurse)
          if ($compilerFiles.Count -ne 1) { throw "Expected one configured C++ compiler" }
          $compilerText = Get-Content $compilerFiles[0].FullName -Raw
          if ($compilerText -notmatch '(?m)^set\(CMAKE_CXX_COMPILER "([^"]+)"\)') {
            throw "Cannot read the configured C++ compiler"
          }
          $compilerBin = Split-Path -Parent $Matches[1]
          $asanRuntime = Join-Path $compilerBin "clang_rt.asan_dynamic-x86_64.dll"
          if (-not (Test-Path $asanRuntime -PathType Leaf)) {
            throw "MSVC x64 ASan runtime not installed: $asanRuntime"
          }
          # Debug /MDd also needs the selected VS installation's Debug CRT.
          $vcRoot = [IO.Path]::GetFullPath((Join-Path $compilerBin "../../../../../.."))
          $debugCrtDirs = @(Get-ChildItem (Join-Path $vcRoot "Redist/MSVC") -Filter msvcp140d.dll -File -Recurse |
            Where-Object { $_.DirectoryName -match '[/\\]x64[/\\]' } |
            Select-Object -ExpandProperty DirectoryName -Unique |
            Sort-Object -Descending)
          if ($debugCrtDirs.Count -eq 0) { throw "MSVC x64 Debug CRT not installed" }
          $env:PATH = (@($compilerBin) + $debugCrtDirs + @($env:PATH)) -join ';'
          ctest --test-dir build/flavors/asan -C Debug --no-tests=error --output-on-failure

  # ────────────────────────────────────────────────────────────────────
  # API reference (Doxygen) — builds the `aria_docs` target so a broken
  # Doxyfile or a malformed doc comment fails CI rather than surfacing
  # only when someone tries to publish the reference (ROADMAP P1-F).
  # Kept separate from the compiled test matrix.
  # ────────────────────────────────────────────────────────────────────
  docs:
    name: API docs (Doxygen)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Cheap and dependency-free, so it runs before anything is built: a
      # guide that names a symbol the headers do not define is a broken
      # promise to the reader, and no compiler ever sees prose. Added after
      # an audit found four such names shipped in the guides — including one
      # wrong spelling that had been copied into three adapter docs.
      - name: Verify documented API symbols exist
        run: ./scripts/check-docs-api.sh

      - name: Install ninja + graphviz
        run: brew install ninja graphviz

      - name: Install official Doxygen
        run: ./scripts/install-doxygen.sh "$RUNNER_TEMP/aria-doxygen"

      - name: Configure (docs)
        run: |
          cmake -S . -B build/flavors/docs -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIA_BUILD_DOCS=ON \
            -DDOXYGEN_EXECUTABLE="$RUNNER_TEMP/aria-doxygen/bin/doxygen" \
            -DARIA_BUILD_TESTS=OFF \
            -DARIA_BUILD_BENCHMARK=OFF

      - name: Build API reference
        run: cmake --build build/flavors/docs --target aria_docs

      - name: Sanity-check generated HTML
        run: test -f build/flavors/docs/docs/html/index.html

      - name: Upload API reference artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria-api-reference
          path: build/flavors/docs/docs/html

  # ────────────────────────────────────────────────────────────────────
  # Cross-DSO IProperty and shared reactive graph acceptance gates.
  # This remains a separate job
  # because an ABI regression deserves a precise failure rather than being
  # buried in the full test matrix.
  # ────────────────────────────────────────────────────────────────────
  abi-smoke:
    name: Cross-dylib ABI smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14

      - name: Configure (shared libs + acceptance tests)
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build/flavors/abi-smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIA_BUILD_SHARED=ON \
            -DARIA_BUILD_TESTS=ON \
            -DARIA_BUILD_BENCHMARK=OFF

      - name: Build
        run: cmake --build build/flavors/abi-smoke -j

      - name: Run cross-DSO ABI gate
        run: ctest --test-dir build/flavors/abi-smoke -R "^cross_dylib_(abi_smoke|reactive)$" --no-tests=error --output-on-failure

  # ────────────────────────────────────────────────────────────────────
  # clang-tidy gate — runs on macOS with Homebrew LLVM and a matching
  # findings baseline. Lints every TU in compile_commands.json
  # (headers covered via HeaderFilterRegex in .clang-tidy) and compares
  # the normalized findings against scripts/clang-tidy-baseline.txt:
  # the gate fails only on NEW debt. Until the gate was fixed to actually
  # run (bash 3.2 has no globstar), it had never linted a single header,
  # so the first real run surfaced a large pre-existing backlog that is
  # baselined here instead of being mass-fixed (several checks — e.g.
  # performance-enum-size — are ABI- or behavior-changing to "fix").
  # Regenerate the baseline via the uploaded artifact; see the header of
  # scripts/tidy-gate.sh.
  # ────────────────────────────────────────────────────────────────────
  clang-tidy:
    name: clang-tidy gate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install ninja + clang-tidy
        run: |
          brew install ninja
          # The gate requires the LLVM major recorded by its baseline. Update
          # the tool and reviewed baseline together; a future formula upgrade
          # must fail the version check rather than silently change findings.
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify clang-tidy matches the reviewed baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          version = subprocess.check_output(['clang-tidy', '--version'], text=True)
          print(version, end='')
          actual = re.search(r'\bversion\s+(\d+)\.', version)
          expected = re.search(r'^# clang-tidy (\d+)\.', Path('scripts/clang-tidy-baseline.txt').read_text())
          if not actual or not expected or actual[1] != expected[1]:
              raise SystemExit('clang-tidy major must match the reviewed baseline before building')
          PY

      - name: Configure (compile_commands.json)
        run: |
          cmake -S . -B build/flavors/tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build (so generated headers/sources exist)
        run: cmake --build build/flavors/tidy -j

      - name: Run clang-tidy gate (TU-based, baseline)
        run: scripts/tidy-gate.sh build/flavors/tidy

      - name: Upload clang-tidy findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-findings
          path: scripts/tidy-findings.txt
          if-no-files-found: ignore
